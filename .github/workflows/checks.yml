name: Template checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s .devcontainer/tests -v
      - run: python -m pytest tests
      - run: ruff check .
      - run: ruff format --check .

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @devcontainers/cli@0.80.0
      - run: devcontainer up --workspace-folder .
      - run: devcontainer exec --workspace-folder . python .devcontainer/smoke.py
      - name: Verify saved untracked work survives container removal
        run: |
          devcontainer exec --workspace-folder . python -c "from pathlib import Path; Path('persistence-proof.txt').write_text('saved but not committed')"
          test "$(cat persistence-proof.txt)" = 'saved but not committed'
          docker compose -f .devcontainer/compose.runtime.yaml -f .devcontainer/compose.yaml down
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . python -c "from pathlib import Path; assert Path('persistence-proof.txt').read_text() == 'saved but not committed'"
          rm persistence-proof.txt
      - if: always()
        run: docker compose -f .devcontainer/compose.runtime.yaml -f .devcontainer/compose.yaml down
